<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Listado de Alumnos</title>

    <!-- ===== CSS inline para PDF ===== -->
    <style>
        /* ====== Fuente moderna ====== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            min-height: 100vh;
            color: #1a1a1a;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 50px;
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(to right, #000, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Contenedor estilo "Bento" */
        .table-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* Tabla Minimalista */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 1.5px;
        }

        td {
            padding: 20px 16px;
            border: none;
        }

        /* Filas tipo "Card" */
        tbody tr {
            background-color: #fff;
            transition: all 0.3s ease;
        }

        /* Redondear bordes de las filas */
        tbody tr td:first-child {
            border-radius: 12px 0 0 12px;
        }

        tbody tr td:last-child {
            border-radius: 0 12px 12px 0;
        }

        /* Efecto hover Pro */
        tbody tr:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            z-index: 10;
            background-color: #fafafa;
        }

        /* Responsive (solo afecta visualización PDF) */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .table-container { padding: 15px; }
            th { display: none; }
        }
    </style>
</head>

<body>
    <h1>Listado de Alumnos</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Grupo</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="alumno, iterStat : ${alumnos}">
                    <td th:text="${iterStat.index + 1}">1</td>
                    <td th:text="${alumno.nombre}">Nombre</td>
                    <td th:text="${alumno.apellido}">Apellido</td>
                    <td th:text="${alumno.edad}">0</td>
                    <td th:text="${alumno.grupo.value}">1</td> 
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

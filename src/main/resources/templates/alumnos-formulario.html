<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Alumno</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/estilos.css}">
</head>
<body>

    <h1>Crear Nuevo Alumno</h1>

    <form th:action="@{/web/alumnos/nuevo}" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" th:value="${alumno.nombre}">
        </div>
        <div>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" th:value="${alumno.apellido}">
        </div>
        <div>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" th:value="${alumno.edad}">
        </div>
        <div>
            <button type="submit">Crear Alumno</button>
        </div>
    </form>

    <div>
        <a th:href="@{/web/alumnos}">Volver al listado</a>
    </div>

</body>
</html>

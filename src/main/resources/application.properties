spring.application.name=instituto
api.version=1.0

# Base de datos H2
spring.datasource.url=jdbc:h2:mem:testdb
# Para persistente en archivo: spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# No permitimos que Hibernate modifique el esquema (lo cargaremos desde schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Habilitar consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración optimizada para desarrollo
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging SQL para debugging
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Internacionalización
spring.messages.encoding=UTF-8
# Ruta desde resources/nombre del fichero
spring.messages.basename=messages